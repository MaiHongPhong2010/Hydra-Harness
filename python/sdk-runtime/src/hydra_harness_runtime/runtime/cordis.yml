# Bundled default config. The runtime still requires an explicit
# $HYDRA_CORDIS_CONFIG or argv path; the SDK injects this path for bundled
# zero-config launches. SDK-set session-root and cwd variables have manual-run fallbacks.

# Stdio JSON-RPC server entry; without it the agent has no SDK client.
- id: sdk-jsonrpc-server
  name: '@hydraharness/harness-sdk-jsonrpc-server'

- id: agent-default-model
  name: '@hydraharness/harness-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: settings
  name: '@hydraharness/harness-settings-file'

- id: workspace-config
  name: '@hydraharness/harness-workspace-config'

# Agent spine; the SDK server creates agents per sessionId.
- id: agent-core
  name: '@hydraharness/harness-agent-spine-demo'
  config:
    workspaceContext:
      maxBytes: 65536

# Stock DeepSeek adapters. The adapter resolves DEEPSEEK_API_KEY through the
# credential seam and, with no provider mounted here, from the launching
# environment; DEEPSEEK_BASE_URL follows the same environment ladder. Neither
# is inlined, so this file names no secret and no route.
- id: llm-deepseek
  name: '@hydraharness/harness-llm-deepseek'

# JSONL persistence; $HYDRA_SESSION_ROOT wins over ./.sessions in the process cwd.
- id: sessions
  name: '@hydraharness/harness-session-persistence-jsonl'
  config:
    root: !!js process.env.HYDRA_SESSION_ROOT ?? './.sessions'

# Persistence owns durable storage; this separate policy explicitly selects
# the request, tool-dispatch, and completed-step durability checkpoints.
- id: session-checkpoints
  name: '@hydraharness/harness-session-checkpoint-policy'

# Local bash executor; $HYDRA_CWD wins over the process cwd.
# Managed child-process groups for the bash executor (spawn/kill/output plumbing).
- id: subprocess
  name: '@hydraharness/harness-subprocess-local'

- id: bash
  name: '@hydraharness/harness-bash-local'
  config:
    cwd: !!js process.env.HYDRA_CWD ?? process.cwd()

# Local filesystem provider for workspace instruction loading. This does not
# expose model-facing file tools by itself.
- id: fs-local
  name: '@hydraharness/harness-fs-local'
  config:
    cwd: !!js process.env.HYDRA_CWD ?? process.cwd()
